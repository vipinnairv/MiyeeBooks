<body>
<div id="root"></div>

<!-- App modules: pre-compiled from src/js/*.jsx at build time (esbuild).
     The browser loads plain JS - no in-browser JSX compilation. Order matters:
     all module scripts are classic scripts sharing one global lexical scope,
     and the final module performs the ReactDOM mount. -->
<!--APP_SCRIPTS-->

<!-- Register the service worker (installable + offline). Kept out of the module
     graph so registration never blocks first paint. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('Service worker registration failed:', e && e.message);
      });
    });
  }
</script>
</body>
