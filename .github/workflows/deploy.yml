name: Build & Deploy to GitHub Pages

# Pre-compiles the JSX modules (src/js/*.jsx -> dist/js/*.js) with esbuild and
# publishes dist/ to GitHub Pages. The deployed page loads plain, pre-compiled
# JS - no in-browser JSX compilation.
#
# One-time setup: Settings -> Pages -> "Build and deployment" -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token; the Pages deploy needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one, but never cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (accounting invariants + data-safety guards)
        run: npm test

      - name: Build (pre-compile JSX -> dist/)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
